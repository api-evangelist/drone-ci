openapi: 3.1.0
info:
  title: Drone CI REST Builds Cron API
  version: 1.0.0
  description: Best-effort OpenAPI for the Drone CI REST API, used to manage repositories, builds, secrets, cron jobs, templates, and the current user. Authentication uses a bearer token retrieved from a user's Drone profile page.
  contact:
    name: API Evangelist
    email: kin@apievangelist.com
    url: https://docs.drone.io/api/
servers:
- url: https://drone.example.com
  description: A Drone CI server (self-hosted; substitute your host)
security:
- bearerAuth: []
tags:
- name: Cron
paths:
  /api/repos/{owner}/{repo}/cron:
    parameters:
    - $ref: '#/components/parameters/Owner'
    - $ref: '#/components/parameters/Repo'
    get:
      tags:
      - Cron
      summary: List cron jobs for a repository
      operationId: listRepoCron
      responses:
        '200':
          description: Cron jobs
    post:
      tags:
      - Cron
      summary: Create a cron job for a repository
      operationId: createRepoCron
      responses:
        '201':
          description: Cron created
components:
  parameters:
    Owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    Repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
