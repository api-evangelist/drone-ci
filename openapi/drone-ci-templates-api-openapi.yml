openapi: 3.1.0
info:
  title: Drone CI REST Builds Templates API
  version: 1.0.0
  description: Best-effort OpenAPI for the Drone CI REST API, used to manage repositories, builds, secrets, cron jobs, templates, and the current user. Authentication uses a bearer token retrieved from a user's Drone profile page.
  contact:
    name: API Evangelist
    email: kin@apievangelist.com
    url: https://docs.drone.io/api/
servers:
- url: https://drone.example.com
  description: A Drone CI server (self-hosted; substitute your host)
security:
- bearerAuth: []
tags:
- name: Templates
paths:
  /api/templates:
    get:
      tags:
      - Templates
      summary: List pipeline templates
      operationId: listTemplates
      responses:
        '200':
          description: Templates
    post:
      tags:
      - Templates
      summary: Create a pipeline template
      operationId: createTemplate
      responses:
        '201':
          description: Template created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
