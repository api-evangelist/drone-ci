description: >-
  FOCUS-aligned FinOps profile for Drone. As an open-source self-hosted CI,
  Drone has no SaaS invoice; the cost surface is the underlying cloud spend
  for the Drone server and runner pool. Customers needing commercial support
  pay Harness via Harness Continuous Integration contracts.
notes: >-
  Cost allocation is straightforward — the Drone server VM and runner VMs are
  ordinary cloud resources tagged in your AWS/Azure/GCP account. Container/
  registry storage and outbound network are usually a smaller fraction of
  total spend than runner compute.
