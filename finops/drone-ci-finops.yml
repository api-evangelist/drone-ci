principles:
- name: Visibility
  description: Tag Drone resources in your cloud account; consume FOCUS cost-export per cloud.
- name: Allocation
  description: Allocate runner-pool spend by team via runner labels and resource tags.
- name: Optimization
  description: Use spot/preemptible for runner pool; auto-scale to zero off-hours; right-size Drone server.
- name: Accountability
  description: Assign cluster/cloud-account owners; review CI runner spend monthly.
