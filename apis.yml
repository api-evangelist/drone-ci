aid: drone-ci
url: https://raw.githubusercontent.com/api-evangelist/drone-ci/refs/heads/main/apis.yml
name: Drone
kind: company
description: >-
  Drone is a container-native open-source continuous delivery platform owned by
  Harness. Pipelines are defined in YAML and executed in Docker containers. The
  Drone server exposes a REST API used by the Drone CLI, dashboard and SDKs;
  Drone is now positioned as the open-source upstream of Harness Continuous
  Integration (Drone Enterprise / Harness CI).
