description: >-
  Drone is open-source (Apache 2.0) self-hosted CI. Drone Enterprise has been
  rolled into Harness Continuous Integration; commercial offerings are sold
  via Harness. Customers running Drone OSS pay only for their own underlying
  infrastructure (Drone server VM + agent runners).
notes: >-
  Drone-branded list pricing is no longer published since Harness consolidated
  Drone Enterprise into Harness CI. Numeric pricing remains unreconciled
  pending Harness sales engagement.
sources:
- https://github.com/harness/drone/blob/master/LICENSE
- https://www.harness.io/products/continuous-integration
- https://www.harness.io/pricing
plans:
- id: drone-oss
  name: Drone Open Source
  type: free
  description: Apache 2.0 self-hosted Drone server and runners. Free.
  entries:
  - label: Open source
    name: oss
    type: flat
    metric: license
    limit: -1
    timeFrame: perpetual
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
- id: drone-harness-ci
  name: Harness Continuous Integration (Drone Enterprise successor)
  type: enterprise
  description: Drone's commercial successor sold and operated by Harness; tiered by build minutes / developer / module.
  entries:
  - label: Custom contract
    name: enterprise_contract
    type: flat
    metric: contract
    limit: -1
    timeFrame: annual
    geo: global
    unit: 1
    price: contact harness sales
    userMultiplied: false
